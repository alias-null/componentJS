<script>
   const { val } = this;
   var param = val(0);
   setInterval(() => {
      if (param.val > 4) {
         param.val = 0;
      } else {
         param.val++;
      }
   }, 1000);
   return {
      param,
   };
</script>
<if .="param.val>-1">
   <if .="param.val>2">
      <div .="innerText=`if-${param.val}`;style.border=`${param.val+3}px solid blue`"></div>
   </if>
</if>
