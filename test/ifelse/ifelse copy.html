<!-- if else 之间为无效 将被删除 -->

<if .="param.val==0">
   <div .="style.border=`${param1.val+3}px solid blue`">
      border=[param1] | if => ${param1.val}
   </div>
   <div .="innerText=`border=[param1] | if-1-${param1.val}`;style.border=`${param1.val+3}px solid blue`">
   </div>
</if>
<else .="param.val==1">
   <div .="style.border=`${param1.val+3}px solid green`">border=[param1] | else-if => ${param1.val}</div>
   <div .="innerText=`else-if-1-${param.val}`;style.border=`${param1.val+3}px solid green`"></div>
</else>
