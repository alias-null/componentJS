<div id="main">
   <div class="container">
      <div class="jumbotron">
         <div class="row">
            <div class="col-md-6">
               <h1>componentJS (keyed)</h1>
            </div>
            <div class="col-md-6">
               <div class="row">
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="run" .="onclick=run">
                        Create 1,000 rows
                     </button>
                  </div>
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="runlots" .="onclick=runLots">
                        Create 10,000 rows
                     </button>
                  </div>
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="add" .="onclick=add">
                        Append 1,000 rows
                     </button>
                  </div>
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="update" .="onclick=update">
                        Update every 10th row
                     </button>
                  </div>
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="clear" .="onclick=clear">
                        Clear
                     </button>
                  </div>
                  <div class="col-sm-6 smallpad">
                     <button type="button" class="btn btn-primary btn-block" id="swaprows" .="onclick=swapRows">
                        Swap Rows
                     </button>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <table class="table table-hover table-striped test-data">
         <tbody>
            <for .="row rows.val">
               <tr>

               </tr>
            </for>
         </tbody>
      </table>
      <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
   </div>
</div>

<script>
   const { val } = this;

   const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"],
      colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "brown", "white", "black", "orange"],
      nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];

   function _random(max) { return Math.round(Math.random() * 1000) % max; };

   let idnum = 1;
   function buildData(count) {
      let data = new Array(count);
      for (let i = 0; i < count; i++) {
         data[i] = {
            id: idnum++,
            label: `${adjectives[_random(adjectives.length)]}\x20${colours[_random(colours.length)]}\x20${nouns[_random(nouns.length)]}`
         };
      }
      return data;
   }

   const selected = val();
   const rows = val([]);

   function setRows(update = rows.val.slice()) {
      rows.val = update;
   }

   function add() {
      rows.val = rows.val.concat(buildData(1000));
   }

   function remove(id) {
      rows.val.splice(
         rows.val.findIndex((d) => d.id === id),
         1
      );
      setRows();
   }

   function select(id) {
      selected.val = id;
   }

   function run() {
      setRows(buildData());
      selected.val = undefined;
      console.log(rows.val);
   }

   function update() {
      const _rows = rows.val;
      for (let i = 0; i < _rows.length; i += 10) {
         _rows[i].label += ' !!!';
      }
      setRows();
   }

   function runLots() {
      setRows(buildData(10000));
      selected.val = undefined;
   }

   function clear() {
      setRows([]);
      selected.val = undefined;
   }

   function swapRows() {
      const _rows = rows.val;
      if (_rows.length > 998) {
         const d1 = _rows[1];
         const d998 = _rows[998];
         _rows[1] = d998;
         _rows[998] = d1;
         setRows();
      }
   }

   return {
      selected,
      rows,
      setRows,
      add,
      remove,
      select,
      run,
      update,
      runLots,
      clear,
      swapRows,
   }
</script>
